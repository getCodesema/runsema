name: Publish to npm

on:
    push:
        tags:
            - 'v*'

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            # Trusted publishing (OIDC) requires npm >= 11.5.1
            - run: npm install -g npm@latest

            - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...

            # The version is the tag: v0.2.0 publishes 0.2.0.
            - run: sh scripts/build-npm.sh "${GITHUB_REF_NAME#v}"

            - name: Publish the package
              # Empty once the packages trust this workflow (OIDC). Set the NPM_TOKEN secret only to publish
              # a package that does not exist yet: npm cannot trust a workflow for a package it has never seen.
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  case "$VERSION" in
                    *-beta*|*-rc*|*-alpha*) DIST_TAG=next ;;
                    *) DIST_TAG=latest ;;
                  esac
                  PUBLISHED="$(npm view "@codesema/runsema@$VERSION" version 2>/dev/null || echo none)"
                  if [ "$VERSION" = "$PUBLISHED" ]; then
                    echo "@codesema/runsema@$VERSION already published, skipping"
                    exit 0
                  fi
                  cd dist/npm/runsema && npm publish --access public --tag "$DIST_TAG"
